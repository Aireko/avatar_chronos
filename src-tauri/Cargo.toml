[package]
name = "avatar"
version = "0.1.0"
description = "Tauri + React app with a C backend"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "avatar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Compiles the C backend in ../backend (see build.rs).
cc = "1.2"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Local AI (src/ai): talks to the Ollama server over plain HTTP. No TLS backend
# is compiled in, so OLLAMA_BASE_URL must be http:// (see ai/config.rs).
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
# `process` runs the GitHub CLI for PR Bug Check (src/review/github.rs).
tokio = { version = "1", features = ["io-util", "macros", "process", "sync", "time"] }
tokio-util = "0.7"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
url = "2"
tauri-plugin-dialog = "2"

[dev-dependencies]
# The mocked Ollama server in src/ai/test_support.rs needs sockets and a runtime.
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
